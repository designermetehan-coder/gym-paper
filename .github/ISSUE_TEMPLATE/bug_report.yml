name: Bug report
description: Something is not working as expected
labels: [bug]
body:
  - type: dropdown
    id: app
    attributes:
      label: App
      options: [iPhone, Apple Watch, Widgets, Web (PWA), Website]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version and OS
      placeholder: "GYM Paper 1.1.1 · iOS 26.1 · iPhone 17 Pro"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Workout
        2. Start "Lower body"
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual
    validations:
      required: true
  - type: textarea
    id: media
    attributes:
      label: Screenshots or recordings
