name: iOS
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode
        run: |
          X=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$X"; xcodebuild -version
      - name: Core tests (GymPaperKit)
        working-directory: ios/GymPaperKit
        run: swift test
      - name: Generate Xcode project
        working-directory: ios
        run: brew install xcodegen && xcodegen generate
      - name: Build app (simulator, unsigned)
        working-directory: ios
        run: |
          # iPhone Duo APIs need the Xcode 27.1 SDK; build without them when it isn't available
          EXTRA=""
          xcodebuild -version | grep -qE "Xcode 2[7-9]" || EXTRA="SWIFT_ACTIVE_COMPILATION_CONDITIONS=DEBUG"
          xcodebuild -project GymPaper.xcodeproj -scheme GymPaper \
            -destination 'generic/platform=iOS Simulator' -configuration Debug \
            CODE_SIGNING_ALLOWED=NO $EXTRA build | tail -20
